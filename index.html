<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>조개점 | 운세가 맛집</title>
  <style>
    :root {
      --pink: #ec5b92;
      --pink-2: #ff8eba;
      --rose: #ffccd9;
      --lavender: #d9c5ff;
      --lavender-2: #f3eaff;
      --cream: #fff5e7;
      --beige: #f7dfbd;
      --gold: #ffd45a;
      --brown: #6f3d27;
      --ink: #171717;
      --muted: #77736f;
      --line: #eee6dc;
      --shadow: 0 8px 24px rgba(0, 0, 0, .08);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(255, 215, 236, .55), transparent 28%),
        radial-gradient(circle at 95% 8%, rgba(220, 202, 255, .55), transparent 24%),
        #fffaf7;
    }

    .phone {
      width: min(100vw, 430px);
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 20px 70px rgba(0,0,0,.12);
      padding-bottom: 78px;
    }

    header {
      height: 72px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(240, 230, 220, .7);
    }

    .brand { display: flex; align-items: center; gap: 9px; }
    .logo {
      width: 38px; height: 38px; border-radius: 13px;
      display: grid; place-items: center;
      background: linear-gradient(145deg, #fff0f8, #eee3ff);
      box-shadow: inset 0 0 0 1px rgba(236,91,146,.12), 0 6px 18px rgba(236,91,146,.13);
      font-size: 23px;
    }
    .brand strong { display:block; font-size: 18px; line-height: 1.05; letter-spacing: -.5px; }
    .brand span { display:block; margin-top:3px; font-size: 11px; color: var(--muted); }
    .login {
      border: 0;
      border-radius: 15px;
      background: linear-gradient(180deg, #ffdf68, #ffc739);
      height: 44px;
      padding: 0 20px;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 7px 16px rgba(255, 197, 54, .28);
      cursor: pointer;
    }

    .hero {
      margin: 12px 12px 0;
      height: clamp(220px, 58vw, 260px);
      position: relative;
      overflow: hidden;
      background: #fff0e9;
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(236,91,146,.14);
    }
    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: opacity .18s ease;
    }
    .hero img.is-changing { opacity: .35; }
    .dots { position: absolute; z-index:4; bottom: 14px; left:0; right:0; display:flex; justify-content:center; gap: 8px; }
    .dot {
      width:8px;
      height:8px;
      border:0;
      border-radius:999px;
      padding:0;
      background:rgba(255,255,255,.75);
      box-shadow: 0 1px 4px rgba(0,0,0,.16);
      cursor:pointer;
      transition: width .18s ease, background .18s ease, transform .18s ease;
    }
    .dot:hover { transform: translateY(-1px); }
    .dot.active { width:26px; background:#fff; }

    .tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 16px 16px 12px;
      background: #fff;
    }
    .tabs::-webkit-scrollbar { display:none; }
    .chip {
      white-space: nowrap;
      border: 0;
      border-radius: 999px;
      padding: 9px 14px;
      background: #f4f0ec;
      color: #1e1e1e;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .chip:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(66, 35, 50, .08);
    }
    .chip:active { transform: translateY(0) scale(.96); }
    .chip.active { background: #050505; color: #fff; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 12px 18px;
    }
    .card {
      background: #fff;
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
      min-width: 0;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(236,91,146,.14); border-color: rgba(236,91,146,.16); }
    .card:active { transform: scale(.985); }
    .visual {
      position: relative;
      aspect-ratio: 1 / 1;
      height: auto;
      overflow: hidden;
      background: #fff1ec;
    }
    .visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .body { padding: 13px 12px 14px; }
    .body h3 { margin: 0 0 7px; font-size: 18px; line-height: 1.15; letter-spacing:-.4px; }
    .body p { margin: 0 0 13px; color: var(--muted); font-size: 13px; line-height: 1.42; min-height: 37px; }
    .card-footer { display:flex; align-items:center; justify-content:space-between; gap:6px; }
    .trial { color: var(--pink); font-weight: 900; font-size: 13px; white-space: nowrap; }
    .go {
      border:0; border-radius:999px;
      padding: 9px 11px;
      color:#fff;
      background: linear-gradient(180deg, #f06aa0, #e44786);
      font-weight:900;
      font-size: 11px;
      box-shadow: 0 7px 16px rgba(228,71,134,.24);
      white-space: nowrap;
      cursor:pointer;
      transition: filter .18s ease, transform .18s ease;
    }
    .go:hover { filter: brightness(1.04); }
    .go:active { transform: scale(.96); }
    .saju .go {
      background: linear-gradient(180deg, #bd91f2, #8f62dc);
      box-shadow: 0 7px 16px rgba(143, 98, 220, .24);
    }
    .zami .go {
      background: linear-gradient(180deg, #63a7f4, #3c78d4);
      box-shadow: 0 7px 16px rgba(60, 120, 212, .24);
    }
    .taek .go {
      background: linear-gradient(180deg, #f0b35f, #d98635);
      box-shadow: 0 7px 16px rgba(217, 134, 53, .25);
    }

    nav {
      position: fixed;
      left: 50%; bottom: 0;
      transform: translateX(-50%);
      width: min(100vw, 430px);
      height: 78px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(230,220,215,.9);
      display:grid;
      grid-template-columns: repeat(5,1fr);
      align-items:center;
      padding: 0 8px;
      z-index:20;
      box-shadow: 0 -8px 28px rgba(66, 35, 50, .08);
    }
    .nav-item {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-align:center;
      color:#4d4d4d;
      font-size: 11px;
      font-weight:600;
      text-decoration: none;
      justify-self: center;
      min-width: 0;
      cursor: pointer;
      transition: color .18s ease, transform .18s ease;
    }
    .nav-item:hover { color: var(--pink); transform: translateY(-2px); }
    .nav-item:active { transform: translateY(0) scale(.96); }
    .nav-item .ico {
      display:block;
      width: 22px;
      height: 22px;
      margin: 0;
    }
    .nav-item .ico svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: currentColor;
    }
    .nav-item.active { color: var(--pink); }
    .nav-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100%;
      color:#4d4d4d;
      font-size: 11px;
      font-weight:700;
      text-align:center;
      text-decoration:none;
      justify-self:center;
      cursor: default;
      transition: color .18s ease;
    }
    .nav-center:hover { color: var(--pink); transform: none; }
    .nav-center:active { transform: none; }
    .fortune-fab {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: linear-gradient(135deg, #ffcc6f 0%, #ff79bd 50%, #9b6bff 100%);
      box-shadow: 0 8px 22px rgba(236, 91, 145, .32);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transform: translateY(-18px);
      cursor: pointer;
      padding: 0;
      transition: transform .18s ease, filter .18s ease;
    }
    .nav-center:hover .fortune-fab { filter: brightness(1.05); box-shadow: 0 10px 26px rgba(236, 91, 145, .4); }
    .fortune-fab:active { transform: translateY(-16px) scale(.96); }
    .fortune-fab-img {
      width: 118%;
      height: 118%;
      object-fit: contain;
      display: block;
    }
    .nav-center span {
      margin-top: -14px;
      font-size: 11px;
      font-weight: 700;
      color: #555;
      transition: color .18s ease;
    }
    .nav-center:hover span { color: var(--pink); }

    @media (max-width: 380px) {
      header { padding-left: 12px; padding-right: 12px; }
      .login { padding: 0 18px; font-size: 15px; }
      .grid { gap: 10px; padding-left: 10px; padding-right: 10px; }
      .body { padding: 12px 10px 13px; }
      .body h3 { font-size: 16px; }
      .body p { font-size: 12px; }
      .go { padding: 8px 9px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="조개점 운세 서비스 홈">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">🐚</div>
        <div>
          <strong>조개점</strong>
          <span>운세가 맛집</span>
        </div>
      </div>
      <button class="login" type="button">로그인</button>
    </header>

    <section class="hero" aria-label="메인 배너">
      <img id="heroBanner" src="./ChatGPT Image 2026년 7월 1일 오후 10_26_55.png" alt="운세 배너 1" />
      <div class="dots" aria-label="배너 선택">
        <button class="dot active" type="button" aria-label="첫 번째 배너"></button>
        <button class="dot" type="button" aria-label="두 번째 배너"></button>
        <button class="dot" type="button" aria-label="세 번째 배너"></button>
        <button class="dot" type="button" aria-label="네 번째 배너"></button>
      </div>
    </section>

    <section class="tabs" aria-label="카테고리">
      <button class="chip active" type="button">전체</button>
      <button class="chip" type="button">사주·명리</button>
      <button class="chip" type="button">자미두수</button>
      <button class="chip" type="button">궁합</button>
      <button class="chip" type="button">상담</button>
    </section>

    <section class="grid" aria-label="운세 상품 목록">
      <article class="card saju">
        <div class="visual">
          <img src="./assets/images/ChatGPT Image 2026년 7월 1일 오후 09_29_26 (2).png" alt="990원 사주 카드 이미지" />
        </div>
        <div class="body">
          <h3>990원 사주</h3>
          <p>용하고 소문난 사주 해설</p>
          <div class="card-footer">
            <span class="trial">조개 1개</span>
            <button class="go" type="button">해설 보러가기 〉</button>
          </div>
        </div>
      </article>

      <article class="card match">
        <div class="visual">
          <img src="./assets/images/ChatGPT Image 2026년 7월 1일 오후 09_29_26 (3).png" alt="궁합 해설 카드 이미지" />
        </div>
        <div class="body">
          <h3>궁합 해설</h3>
          <p>우리 사이는 몇 점? 궁합도 잘봐요</p>
          <div class="card-footer">
            <span class="trial">조개 1개</span>
            <button class="go" type="button">해설 보러가기 〉</button>
          </div>
        </div>
      </article>

      <article class="card zami">
        <div class="visual">
          <img src="./assets/images/ChatGPT Image 2026년 7월 1일 오후 09_29_26 (4).png" alt="자미두수 카드 이미지" />
        </div>
        <div class="body">
          <h3>자미두수</h3>
          <p>별빛처럼 정교한 운명 풀이</p>
          <div class="card-footer">
            <span class="trial">조개 1개</span>
            <button class="go" type="button">해설 보러가기 〉</button>
          </div>
        </div>
      </article>

      <article class="card taek">
        <div class="visual">
          <img src="./assets/images/ChatGPT Image 2026년 7월 1일 오후 09_29_26 (5).png" alt="택일 카드 이미지" />
        </div>
        <div class="body">
          <h3>택일</h3>
          <p>중요한 날을 위한 길일 안내</p>
          <div class="card-footer">
            <span class="trial">조개 1개</span>
            <button class="go" type="button">해설 보러가기 〉</button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <nav aria-label="하단 메뉴">
    <a class="nav-item active" href="#">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M3.5 10.8 12 3.7l8.5 7.1v8.4c0 .7-.5 1.2-1.2 1.2h-4.6v-5.9H9.3v5.9H4.7c-.7 0-1.2-.5-1.2-1.2v-8.4Z" />
        </svg>
      </span>
      홈
    </a>
    <a class="nav-item" href="#">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M12 3.5c.5 0 .9.4.9.9v3.3l2.9-1.7c.4-.2 1-.1 1.2.3s.1 1-.3 1.2l-2.9 1.7 2.9 1.7c.4.2.6.8.3 1.2s-.8.6-1.2.3l-2.9-1.7v3.3c0 .5-.4.9-.9.9s-.9-.4-.9-.9v-3.3l-2.9 1.7c-.4.2-1 .1-1.2-.3s-.1-1 .3-1.2l2.9-1.7-2.9-1.7c-.4-.2-.6-.8-.3-1.2s.8-.6 1.2-.3l2.9 1.7V4.4c0-.5.4-.9.9-.9Zm-6.4 13h12.8c.8 0 1.4.6 1.4 1.4v1.2c0 .8-.6 1.4-1.4 1.4H5.6c-.8 0-1.4-.6-1.4-1.4v-1.2c0-.8.6-1.4 1.4-1.4Z" />
        </svg>
      </span>
      사주추가
    </a>
    <div class="nav-item nav-center">
      <button class="fortune-fab" type="button" aria-label="무료운세">
        <img src="./assets/images/ChatGPT Image 2026년 7월 1일 오후 09_48_22.png" alt="무료운세 조개 아이콘" class="fortune-fab-img" />
      </button>
      <span>무료운세</span>
    </div>
    <a class="nav-item" href="#">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M12 4.2c4.6 0 8.3 3 8.3 6.7s-3.7 6.7-8.3 6.7c-.8 0-1.6-.1-2.3-.3l-3.8 2.1c-.6.3-1.2-.2-1-.9l.8-3.1c-1.3-1.2-2-2.7-2-4.4 0-3.8 3.7-6.8 8.3-6.8Zm-3.1 7.7c.6 0 1-.4 1-1s-.4-1-1-1-1 .4-1 1 .4 1 1 1Zm3.1 0c.6 0 1-.4 1-1s-.4-1-1-1-1 .4-1 1 .4 1 1 1Zm3.1 0c.6 0 1-.4 1-1s-.4-1-1-1-1 .4-1 1 .4 1 1 1Z" />
        </svg>
      </span>
      대화방
    </a>
    <a class="nav-item" href="#">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M6.2 4.2h11.6c.8 0 1.5.7 1.5 1.5v14.1c0 .5-.6.9-1 .5L12 16.9l-6.3 3.4c-.5.3-1-.1-1-.5V5.7c0-.8.7-1.5 1.5-1.5Zm2.2 4.2c-.5 0-.9.4-.9.9s.4.9.9.9h7.2c.5 0 .9-.4.9-.9s-.4-.9-.9-.9H8.4Zm0 3.5c-.5 0-.9.4-.9.9s.4.9.9.9h5.1c.5 0 .9-.4.9-.9s-.4-.9-.9-.9H8.4Z" />
        </svg>
      </span>
      보관함
    </a>
  </nav>
  <script>
    const heroBanners = [
      {
        src: "./ChatGPT Image 2026년 7월 1일 오후 10_26_55.png",
        alt: "운세 배너 1",
      },
      {
        src: "./ChatGPT Image 2026년 7월 1일 오후 10_27_04.png",
        alt: "운세 배너 2",
      },
      {
        src: "./ChatGPT Image 2026년 7월 1일 오후 10_27_00.png",
        alt: "운세 배너 3",
      },
      {
        src: "./ChatGPT Image 2026년 7월 1일 오후 10_27_08.png",
        alt: "운세 배너 4",
      },
    ];
    const heroBanner = document.querySelector("#heroBanner");
    const heroDots = document.querySelectorAll(".dots .dot");

    heroDots.forEach((dot, index) => {
      dot.addEventListener("click", () => {
        if (dot.classList.contains("active")) return;

        heroDots.forEach((item) => item.classList.remove("active"));
        dot.classList.add("active");
        heroBanner.classList.add("is-changing");

        window.setTimeout(() => {
          heroBanner.src = heroBanners[index].src;
          heroBanner.alt = heroBanners[index].alt;
          heroBanner.classList.remove("is-changing");
        }, 120);
      });
    });

    const categoryChips = document.querySelectorAll(".tabs .chip");

    categoryChips.forEach((chip) => {
      chip.addEventListener("click", () => {
        categoryChips.forEach((item) => item.classList.remove("active"));
        chip.classList.add("active");
      });
    });
  </script>
</body>
</html>
