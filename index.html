<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>조개점 | 운세가 맛집</title>
  <style>
    :root {
      --pink: #ec5b92;
      --pink-2: #ff8eba;
      --rose: #ffccd9;
      --lavender: #d9c5ff;
      --lavender-2: #f3eaff;
      --cream: #fff5e7;
      --beige: #f7dfbd;
      --gold: #ffd45a;
      --brown: #6f3d27;
      --ink: #171717;
      --muted: #77736f;
      --line: #eee6dc;
      --shadow: 0 8px 24px rgba(0, 0, 0, .08);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(255, 215, 236, .55), transparent 28%),
        radial-gradient(circle at 95% 8%, rgba(220, 202, 255, .55), transparent 24%),
        #fffaf7;
    }

    .phone {
      width: min(100vw, 430px);
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 0 1px rgba(0,0,0,.04), 0 20px 70px rgba(0,0,0,.12);
      padding-bottom: 132px;
    }

    header {
      height: 78px;
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(240, 230, 220, .7);
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 42px; height: 42px; border-radius: 14px;
      display: grid; place-items: center;
      background: linear-gradient(145deg, #fff0f8, #eee3ff);
      box-shadow: inset 0 0 0 1px rgba(236,91,146,.12), 0 6px 18px rgba(236,91,146,.13);
      font-size: 25px;
    }
    .brand strong { display:block; font-size: 20px; line-height: 1.05; letter-spacing: -.7px; }
    .brand span { display:block; margin-top:4px; font-size: 12px; color: var(--muted); }
    .login {
      border: 0;
      border-radius: 16px;
      background: linear-gradient(180deg, #ffdf68, #ffc739);
      padding: 13px 24px;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 7px 16px rgba(255, 197, 54, .28);
      cursor: pointer;
    }

    .hero {
      margin: 12px 12px 0;
      height: clamp(220px, 58vw, 260px);
      position: relative;
      overflow: hidden;
      background: #fff0e9;
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(236,91,146,.14);
    }
    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .dots { position: absolute; z-index:4; bottom: 14px; left:0; right:0; display:flex; justify-content:center; gap: 8px; }
    .dot { width:8px; height:8px; border-radius:999px; background:rgba(255,255,255,.75); box-shadow: 0 1px 4px rgba(0,0,0,.16); }
    .dot.active { width:26px; background:#fff; }

    .tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 16px 16px 12px;
      background: #fff;
    }
    .tabs::-webkit-scrollbar { display:none; }
    .chip {
      white-space: nowrap;
      border: 0;
      border-radius: 999px;
      padding: 12px 17px;
      background: #f4f0ec;
      color: #1e1e1e;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }
    .chip.active { background: #050505; color: #fff; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 12px 34px;
    }
    .card {
      background: #fff;
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
      min-width: 0;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(236,91,146,.14); border-color: rgba(236,91,146,.16); }
    .card:active { transform: scale(.985); }
    .visual {
      position: relative;
      aspect-ratio: 1 / 1;
      height: auto;
      overflow: hidden;
      background: #fff1ec;
    }
    .visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .body { padding: 13px 12px 14px; }
    .body h3 { margin: 0 0 7px; font-size: 18px; line-height: 1.15; letter-spacing:-.4px; }
    .body p { margin: 0 0 13px; color: var(--muted); font-size: 13px; line-height: 1.42; min-height: 37px; }
    .card-footer { display:flex; align-items:center; justify-content:space-between; gap:6px; }
    .trial { color: var(--pink); font-weight: 900; font-size: 13px; white-space: nowrap; }
    .go {
      border:0; border-radius:999px;
      padding: 9px 11px;
      color:#fff;
      background: linear-gradient(180deg, #f06aa0, #e44786);
      font-weight:900;
      font-size: 11px;
      box-shadow: 0 7px 16px rgba(228,71,134,.24);
      white-space: nowrap;
      cursor:pointer;
      transition: filter .18s ease, transform .18s ease;
    }
    .go:hover { filter: brightness(1.04); }
    .go:active { transform: scale(.96); }

    nav {
      position: fixed;
      left: 50%; bottom: 0;
      transform: translateX(-50%);
      width: min(100vw, 430px);
      height: 86px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(230,220,215,.9);
      display:grid;
      grid-template-columns: 1fr 92px 1fr;
      align-items:end;
      padding: 8px 8px 18px;
      z-index:20;
      box-shadow: 0 -8px 28px rgba(66, 35, 50, .08);
    }
    .nav-item {
      text-align:center;
      color:#4d4d4d;
      font-size: 11px;
      font-weight:700;
      text-decoration: none;
      justify-self: center;
      min-width: 74px;
    }
    .nav-item .ico {
      display:block;
      width: 25px;
      height: 25px;
      margin: 0 auto 5px;
    }
    .nav-item .ico svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: currentColor;
    }
    .nav-item.active { color: var(--pink); }
    .nav-center { position:relative; transform: translateY(-12px); }
    .nav-center .bubble {
      width: 68px; height:68px;
      margin: 0 auto 2px;
      border-radius: 50%;
      display:grid; place-items:center;
      background: linear-gradient(145deg, #ffb25d, #f85b9b 55%, #b456ed);
      color:#fff;
      border: 5px solid #fff;
      box-shadow: 0 8px 20px rgba(236,91,146,.33);
    }
    .nav-center .bubble svg { width: 35px; height: 35px; fill: currentColor; }

    @media (max-width: 380px) {
      header { padding-left: 14px; padding-right: 14px; }
      .login { padding: 12px 20px; font-size: 17px; }
      .grid { gap: 10px; padding-left: 10px; padding-right: 10px; }
      .body { padding: 12px 10px 13px; }
      .body h3 { font-size: 16px; }
      .body p { font-size: 12px; }
      .go { padding: 8px 9px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="조개점 운세 서비스 홈">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">🐚</div>
        <div>
          <strong>조개점</strong>
          <span>운세가 맛집</span>
        </div>
      </div>
      <button class="login" type="button">로그인</button>
    </header>

    <section class="hero" aria-label="메인 배너">
      <img src="./assets/images/ChatGPT Image 2026년 7월 1일 오후 09_29_25 (1).png" alt="비법택일 운세 배너" />
      <div class="dots" aria-hidden="true">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot active"></span>
      </div>
    </section>

    <section class="tabs" aria-label="카테고리">
      <button class="chip active" type="button">전체</button>
      <button class="chip" type="button">사주·명리</button>
      <button class="chip" type="button">자미두수</button>
      <button class="chip" type="button">궁합</button>
      <button class="chip" type="button">상담</button>
    </section>

    <section class="grid" aria-label="운세 상품 목록">
      <article class="card saju">
        <div class="visual">
          <img src="./assets/images/ChatGPT Image 2026년 7월 1일 오후 09_29_26 (2).png" alt="990원 사주 카드 이미지" />
        </div>
        <div class="body">
          <h3>990원 사주</h3>
          <p>용하고 소문난 사주 해설</p>
          <div class="card-footer">
            <span class="trial">조개 1개</span>
            <button class="go" type="button">해설 보러가기 〉</button>
          </div>
        </div>
      </article>

      <article class="card match">
        <div class="visual">
          <img src="./assets/images/ChatGPT Image 2026년 7월 1일 오후 09_29_26 (3).png" alt="궁합 해설 카드 이미지" />
        </div>
        <div class="body">
          <h3>궁합 해설</h3>
          <p>우리 사이는 몇 점? 궁합도 잘봐요</p>
          <div class="card-footer">
            <span class="trial">조개 1개</span>
            <button class="go" type="button">해설 보러가기 〉</button>
          </div>
        </div>
      </article>

      <article class="card zami">
        <div class="visual">
          <img src="./assets/images/ChatGPT Image 2026년 7월 1일 오후 09_29_26 (4).png" alt="자미두수 카드 이미지" />
        </div>
        <div class="body">
          <h3>자미두수</h3>
          <p>별빛처럼 정교한 운명 풀이</p>
          <div class="card-footer">
            <span class="trial">조개 1개</span>
            <button class="go" type="button">해설 보러가기 〉</button>
          </div>
        </div>
      </article>

      <article class="card taek">
        <div class="visual">
          <img src="./assets/images/ChatGPT Image 2026년 7월 1일 오후 09_29_26 (5).png" alt="택일 카드 이미지" />
        </div>
        <div class="body">
          <h3>택일</h3>
          <p>중요한 날을 위한 길일 안내</p>
          <div class="card-footer">
            <span class="trial">조개 1개</span>
            <button class="go" type="button">해설 보러가기 〉</button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <nav aria-label="하단 메뉴">
    <a class="nav-item active" href="#">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M3.5 10.8 12 3.7l8.5 7.1v8.4c0 .7-.5 1.2-1.2 1.2h-4.6v-5.9H9.3v5.9H4.7c-.7 0-1.2-.5-1.2-1.2v-8.4Z" />
        </svg>
      </span>
      홈
    </a>
    <a class="nav-item nav-center" href="#">
      <span class="bubble" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M12 3.2c4.9 0 8.8 3.7 8.8 8.2 0 5.3-5.2 8.9-8.8 10.1-3.6-1.2-8.8-4.8-8.8-10.1 0-4.5 3.9-8.2 8.8-8.2Zm0 3.2c-.5 0-.9.4-.9.9v6.8c0 .5.4.9.9.9s.9-.4.9-.9V7.3c0-.5-.4-.9-.9-.9Zm-3.7 1c-.5.2-.7.7-.5 1.2l2.3 5.9c.2.5.7.7 1.2.5s.7-.7.5-1.2L9.5 7.9c-.2-.5-.7-.7-1.2-.5Zm7.4 0c-.5-.2-1 .1-1.2.5l-2.3 5.9c-.2.5.1 1 .5 1.2.5.2 1-.1 1.2-.5l2.3-5.9c.2-.5-.1-1-.5-1.2Z" />
        </svg>
      </span>
      무료운세
    </a>
    <a class="nav-item" href="#">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M12 12.1c2.4 0 4.3-1.9 4.3-4.3S14.4 3.5 12 3.5 7.7 5.4 7.7 7.8s1.9 4.3 4.3 4.3Zm0 2.1c-4.2 0-7.5 2.4-7.5 5.2 0 .7.5 1.1 1.2 1.1h12.6c.7 0 1.2-.4 1.2-1.1 0-2.8-3.3-5.2-7.5-5.2Z" />
        </svg>
      </span>
      프로필
    </a>
  </nav>
</body>
</html>
